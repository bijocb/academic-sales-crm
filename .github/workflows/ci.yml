name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      APP_DATABASE_URL: postgresql://crm_app:ci-app-password@localhost:5432/crm
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm
      CRM_APP_DB_PASSWORD: ci-app-password
      TEST_DB_OWNER_AUTH: postgres:postgres
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      WEB_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE crm_test"
      - name: Dependency audit (reported, not blocking)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
      - name: Migrate
        run: pnpm db:migrate
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Seed demo data for e2e
        run: NODE_ENV=development pnpm db:seed:demo
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: NODE_ENV=development pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
