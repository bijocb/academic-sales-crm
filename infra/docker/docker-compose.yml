# Local development services. Usage: docker compose -f infra/docker/docker-compose.yml up -d
# Credentials here are for local development only.
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-owner
      POSTGRES_DB: crm
    ports: ['5432:5432']
    volumes:
      - crm-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes:
  crm-postgres:
